name: Language / compiler
description: The compiler crashed, accepted something it should refuse, refused something valid, or the program does the wrong thing.
title: "[compiler] "
labels: ["area: compiler", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. The fastest route to a fix is the smallest program that shows the problem.
        **Remove anything private before you paste it** (paths, names, keys, company code) - it is published here for
        anyone to see. A later EK9 release adds `ek9 -reportbug`, which writes this report for you.

        A security problem? Do not file it here - use "Report a vulnerability" on the Security tab.
  - type: input
    id: version
    attributes:
      label: EK9 version
      description: The output of `ek9 -V`.
      placeholder: "0.0.1-0"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - The compiler crashed (an exception or stack trace)
        - It refused valid code (a wrong error)
        - It accepted code it should refuse (a missing error)
        - The program compiled but does the wrong thing at run time
        - An error message is confusing or wrong
        - Other
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The smallest program that shows the problem
      description: The EK9 source, cut down as far as it still shows the problem. (When your EK9 has `ek9 -reportbug`, paste its report file instead.)
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error text, the wrong output, or the first lines of the stack trace.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: "macOS 15 arm64, Ubuntu 24.04 x86_64, Windows 11 x86_64"
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: The pasted content holds nothing private (paths, names, keys, company code).
          required: true
